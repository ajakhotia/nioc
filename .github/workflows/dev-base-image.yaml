name: dev-base-image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dev-base-image.yaml'
      - 'docker/ubuntuDevBase.dockerfile'
      - 'systemDependencies.json'
      - 'external/infraCommons'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
    paths:
      - '.github/workflows/dev-base-image.yaml'
      - 'docker/ubuntuDevBase.dockerfile'
      - 'systemDependencies.json'
      - 'external/infraCommons'
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  base-stage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os_base:
          - name: ubuntu:22.04
            image: ghcr.io/ajakhotia/infracommons/weekly-base/ubuntu-22-04:latest
          - name: ubuntu:24.04
            image: ghcr.io/ajakhotia/infracommons/weekly-base/ubuntu-24-04:latest
          - name: ubuntu:26.04
            image: ghcr.io/ajakhotia/infracommons/weekly-base/ubuntu-26-04:latest

    steps:
      - name: self-checkout
        id: self-checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: setup-login
        id: setup-login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup-buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: job-cache-base
        id: job-cache-base
        uses: ./external/infraCommons/.github/actions/oci-compliant-image-name
        with:
          build-name: job-cache/${{ matrix.os_base.name }}/base

      - name: image-name-base
        id: image-name-base
        uses: ./external/infraCommons/.github/actions/oci-compliant-image-name
        with:
          build-name: ${{ matrix.os_base.name }}/base

      - name: base
        id: base
        uses: ./external/infraCommons/.github/actions/docker-typical-build-push
        with:
          dockerfile: docker/ubuntuDevBase.dockerfile
          target-stage: base
          cache-backend: registry
          image-name: ${{ steps.image-name-base.outputs.name }}
          shared-cache-to: ${{ steps.job-cache-base.outputs.name }}:cache
          build-args: |
            OS_BASE=${{ matrix.os_base.image }}


  aggregate-base-stage:
    name: aggregate-base-stage
    if: always()
    needs: [base-stage]
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        id: self-checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: aggregate
        id: aggregate
        uses: ./external/infraCommons/.github/actions/matrix-aggregate
        with:
          result: ${{ needs.base-stage.result }}


  dev-base-stage:
    needs: base-stage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os_base:
          - name: ubuntu:22.04
            image: ghcr.io/ajakhotia/infracommons/weekly-base/ubuntu-22-04:latest
          - name: ubuntu:24.04
            image: ghcr.io/ajakhotia/infracommons/weekly-base/ubuntu-24-04:latest
          - name: ubuntu:26.04
            image: ghcr.io/ajakhotia/infracommons/weekly-base/ubuntu-26-04:latest

    steps:
      - name: self-checkout
        id: self-checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: setup-login
        id: setup-login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup-buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: job-cache-base
        id: job-cache-base
        uses: ./external/infraCommons/.github/actions/oci-compliant-image-name
        with:
          build-name: job-cache/${{ matrix.os_base.name }}/base

      - name: image-name-dev-base
        id: image-name-dev-base
        uses: ./external/infraCommons/.github/actions/oci-compliant-image-name
        with:
          build-name: ${{ matrix.os_base.name }}/dev-base

      - name: dev-base
        id: dev-base
        uses: ./external/infraCommons/.github/actions/docker-typical-build-push
        with:
          dockerfile: docker/ubuntuDevBase.dockerfile
          target-stage: dev-base
          cache-backend: registry
          image-name: ${{ steps.image-name-dev-base.outputs.name }}
          shared-cache-from: ${{ steps.job-cache-base.outputs.name }}:cache
          build-args: |
            OS_BASE=${{ matrix.os_base.image }}


  aggregate-dev-base-stage:
    name: aggregate-dev-base-stage
    if: always()
    needs: [dev-base-stage]
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        id: self-checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: aggregate
        id: aggregate
        uses: ./external/infraCommons/.github/actions/matrix-aggregate
        with:
          result: ${{ needs.dev-base-stage.result }}
